version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      docs-tools:
        patterns: ["*"]

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
