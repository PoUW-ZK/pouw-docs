name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown and spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Markdown formatting
        run: npm run lint
      - name: Spelling
        run: npm run spell

  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Internal links
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          ./lychee --offline --no-progress \
            --exclude-path node_modules --exclude-path _site --exclude-path report \
            './**/*.md'

  site:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

  files:
    name: Large files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No files over 5 MB
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +5M -print)
          if [ -n "$big" ]; then
            echo "::error::Files larger than 5 MB belong in GitHub Releases, not in the repository:"
            echo "$big"
            exit 1
          fi

  ci-ok:
    name: ci-ok
    if: always()
    needs: [markdown, links, site, files]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
