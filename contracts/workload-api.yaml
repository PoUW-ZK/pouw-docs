openapi: 3.0.0
info:
  title: Workload Generator API
  version: 1.0.0
  description: API for controlling the workload generator and retrieving test results.
servers:
  - url: http://localhost:8000
    description: Unprefixed control routes on the local workload generator.
  - url: http://localhost:8000/api/v1
    description: Versioned aliases for the control routes (not health or metrics).
paths:
  /health:
    get:
      summary: Check generator health
      operationId: getHealth
      servers:
        - url: http://localhost:8000
          description: Local health server
      responses:
        '200':
          description: Generator is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Generator is unhealthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /metrics:
    get:
      summary: Get generator metrics
      operationId: getMetrics
      servers:
        - url: http://localhost:8001
          description: Local metrics server
      responses:
        '200':
          description: Prometheus-formatted generator metrics.
          content:
            text/plain:
              schema:
                type: string
  /scenarios:
    get:
      summary: List available scenarios
      operationId: listScenarios
      responses:
        '200':
          description: Available scenario names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioList'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /start:
    post:
      summary: Start a workload scenario
      operationId: startScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartScenarioRequest'
      responses:
        '202':
          description: Scenario accepted for execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Another scenario is already running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /stop:
    post:
      summary: Stop scheduling and drain in-flight reads
      operationId: stopScenario
      responses:
        '202':
          description: Stop request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '409':
          description: No scenario is currently running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /status:
    get:
      summary: Get generator status and statistics
      operationId: getStatus
      responses:
        '200':
          description: Current generator status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratorStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /results:
    get:
      summary: Download per-operation read results from the last completed run
      description: >
        Results are cleared when a new scenario starts. They are available
        after that scenario finishes or stops with a result; stopping before
        scheduling begins does not produce one.
      operationId: downloadResults
      responses:
        '200':
          description: CSV with operation, completed, failures, rejected, p50_us, p95_us, p99_us.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '404':
          description: No result is available for the most recently started scenario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: healthy
    ScenarioList:
      type: object
      required:
        - scenarios
      properties:
        scenarios:
          type: array
          description: Names of scenarios available to run.
          items:
            type: string
          example:
            - test
            - sustained-load
    StartScenarioRequest:
      type: object
      required:
        - scenario_name
      properties:
        scenario_name:
          type: string
          description: Name of the scenario to start.
          minLength: 1
          example: test
    OperationResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Scenario started
    GeneratorStatus:
      type: object
      required:
        - status
        - operations
      properties:
        status:
          type: string
          description: Current generator state.
          enum:
            - running
            - stopping
            - stopped
            - error
        scenario:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        operations:
          type: object
          description: >
            Live statistics keyed by uppercase read operation name, reset for
            each run. Percentiles use planned-send-to-response latency in
            microseconds. JSON percentile field names use camelCase, whereas
            the CSV output currently uses snake_case names ending in _us.
          additionalProperties:
            $ref: '#/components/schemas/ReadOperationMetrics'
    ReadOperationMetrics:
      type: object
      required: [completed, failures, rejected, p50Micros, p95Micros, p99Micros]
      properties:
        completed:
          type: integer
          format: int64
          minimum: 0
          description: >
            Reads that completed, including reads that failed. Rejected
            dispatches are not included.
        failures:
          type: integer
          format: int64
          minimum: 0
          description: >
            Failed read completions, including node HTTP errors, connection
            failures, timeouts, and response decoding errors. An out-of-range
            latency also increments this counter, so a failed read with such
            a latency can increment it twice. Expected negative reads are not
            yet classified separately.
        rejected:
          type: integer
          format: int64
          minimum: 0
          description: >
            Scheduled dispatches not accepted by the generator because the
            concurrency limit was reached or the executor rejected them.
            This is not a node HTTP rejection.
        p50Micros:
          type: integer
          format: int64
          minimum: 0
          description: 50th percentile latency in microseconds.
        p95Micros:
          type: integer
          format: int64
          minimum: 0
          description: 95th percentile latency in microseconds.
        p99Micros:
          type: integer
          format: int64
          minimum: 0
          description: 99th percentile latency in microseconds.
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
